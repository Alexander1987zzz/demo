server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: ""
    h2:
      console:
        enabled: true
        path: /h2-console
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true

  springdoc:
    api-docs:

      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html

