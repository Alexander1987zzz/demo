openapi: 3.0.3
info:
  title: Generic CRUD API
  version: 1.0.0

paths:
  /api/users:
    get:
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        200:
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
    post:
      tags: [Users]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        201:
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"

components:
  schemas:
    UserDto:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
      required: [name, email]
    UserCreate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
      required: [name, email]
    PageResponse:
      type: object
      properties:
        content:
          type: array
          items: {}
        totalElements:
          type: integer
        totalPages:
          type: integer

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    size:
      name: size
      in: query
      schema:
        type: integer
        default: 10
    sort:
      name: sort
      in: query
      schema:
        type: string
        default: "id,asc"